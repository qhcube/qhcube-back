jwt.secret=${JWT_SECRET}
jwt.expiration=9000000
jwt.refreshLimit=3000000
max.games.per.player=10
max.moves.per.game=12000
apiPrefix=/api
apiFreePrefix=/free
spring.devtools.add-properties=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.jakarta.persistence.sharedCache.mode=UNSPECIFIED
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.allow-circular-references=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
logging.level.org.springframework=warn
logging.level.es.upm.etsisi.qhcube=warn
server.port=9000
server.url=https://qhcube.etsisi.upm.es
frontend.url=https://qhcube.etsisi.upm.es
spring.mail.host=smtp.upm.es
spring.mail.port=587
spring.mail.transport.protocol=smtp
spring.mail.username=qhcube.etsisi@upm.es
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true
#spring.mail.properties.mail.smtp.quitwait=false
qhcube.mail.sender.name=Juego Hipercubo Cuantico
qhcube.mail.from.address=qhcube.etsisi@upm.es
server.forward-headers-strategy=native
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

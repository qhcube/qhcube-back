spring.profiles.active=@activatedProperties@
spring.jpa.open-in-view=false
qhcube.unverified-accounts.max-days=3

# Tiempos en milisegundos
# Token de 2,5h
jwt.expiration=9000000

# Renovación en los últimos 50 minutos
jwt.refreshLimit=3000000

# Sesión de 8h como máximo
jwt.maxSession=28800000

jwt.secret=${JWT_SECRET}

# Jackson 3: crear los DTOs con el constructor vacío y los setters, como hacía Jackson 2,
# en lugar de usar el constructor con todos los campos (@AllArgsConstructor).
spring.jackson.mapper.detect-parameter-names=false
